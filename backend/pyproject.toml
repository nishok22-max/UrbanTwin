[project]
name = "urbantwin-backend"
version = "0.2.0"
description = "UrbanTwin backend — AI Infrastructure Consequence & Decision Simulator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "networkx>=3.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "ortools>=9.7",
    "geopandas>=0.14",
    "shapely>=2.0",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
